<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuotix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<style>
  :root{
    --ink:#1E2E3D;
    --paper:#F4F7F6;
    --paper-2:#E7EEEC;
    --blue:#FF6B4A;
    --blue-dark:#E8532F;
    --red:#FF6B4A;
    --gold:#2A9D8F;
    --green:#2A9D8F;
    --line:#1E2E3D33;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, #1E2E3D10 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Fraunces', serif;}
  .mono{font-family:'Space Mono', monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--gold);color:var(--ink);}

  /* Header */
  header.top{
    background:var(--ink);
    color:var(--paper);
    padding:22px 20px 24px;
    position:relative;
    overflow:hidden;
    border-bottom:3px solid var(--blue);
  }
  .brand-row{display:flex;align-items:center;justify-content:space-between;max-width:900px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:12px;}
  .app-icon{
    width:42px;height:42px;border-radius:12px;flex-shrink:0;display:block;
    box-shadow:0 2px 6px #00000033;
  }
  .brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.3px;}
  .brand .sub{font-size:12px;opacity:.65;font-family:'Space Mono',monospace;margin-top:2px;}
  .back-btn{
    background:transparent;border:1px solid var(--paper)55;color:var(--paper);
    padding:8px 14px;border-radius:100px;font-size:13px;letter-spacing:.3px;
  }
  .back-btn:hover{border-color:var(--gold);color:var(--gold);}

  main{max-width:900px;margin:0 auto;padding:28px 20px 80px;}

  /* Empty / list */
  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;}
  .section-title h2{font-size:26px;margin:0;}
  .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin:0 0 4px;}

  .primary-btn{
    background:var(--blue); color:var(--paper); border:none;
    padding:12px 20px; border-radius:8px; font-weight:600; font-size:14px;
    display:inline-flex; align-items:center; gap:8px;
    box-shadow:3px 3px 0 var(--ink);
    transition:transform .12s ease;
  }
  .primary-btn:hover{transform:translate(-1px,-1px);}
  .primary-btn:active{transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink);}
  .ghost-btn{
    background:transparent;border:1.5px dashed var(--ink)66;color:var(--ink);
    padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;
  }
  .ghost-btn:hover{border-color:var(--blue);color:var(--blue);}

  /* Boarding pass card */
  .ticket{
    display:grid; grid-template-columns: 1fr 118px;
    background:var(--paper-2);
    border:1.5px solid var(--ink);
    border-radius:10px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .ticket:hover{transform:translateY(-2px); box-shadow:4px 6px 0 var(--ink)22;}
  .ticket-del{
    position:absolute; top:8px; right:8px; z-index:2;
    width:24px; height:24px; border-radius:50%; border:none;
    background:var(--paper); color:var(--blue); font-size:13px; line-height:1;
    display:flex; align-items:center; justify-content:center; opacity:.75;
  }
  .ticket-del:hover{opacity:1; background:var(--blue); color:var(--paper);}
  .ticket-main{padding:18px 20px;}
  .ticket-dest{font-size:22px;font-weight:700;margin:0 0 2px;}
  .ticket-dates{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink)99;margin:0 0 12px;}
  .ticket-members{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    background:var(--paper); border:1px solid var(--ink)44; border-radius:100px;
    padding:3px 10px; font-size:11.5px; font-family:'Space Mono',monospace;
  }
  .ticket-stub{
    border-left:2px dashed var(--ink)55;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:10px; text-align:center; position:relative;
    background:var(--paper);
  }
  .ticket-stub::before, .ticket-stub::after{
    content:""; position:absolute; width:16px;height:16px;background:var(--paper);
    border-radius:50%; left:-9px;
  }
  .ticket-stub::before{top:-8px;} .ticket-stub::after{bottom:-8px;}
  .stub-total-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink)88;font-family:'Space Mono',monospace;}
  .stub-total{font-family:'Space Mono',monospace;font-weight:700;font-size:20px;color:var(--blue-dark);}

  .empty-state{
    border:2px dashed var(--ink)44; border-radius:12px; padding:50px 20px; text-align:center;
  }
  .empty-state .display{font-size:24px;margin:0 0 8px;}
  .empty-state p{color:var(--ink)99;margin:0 0 20px;font-size:14px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:#101820cc; display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .modal{
    background:var(--paper); border-radius:14px; max-width:480px; width:100%;
    padding:26px; max-height:88vh; overflow-y:auto;
    border:1.5px solid var(--ink);
  }
  .modal h3{margin:0 0 18px; font-size:22px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; margin-bottom:5px; color:var(--ink)cc; letter-spacing:.2px;}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border:1.5px solid var(--ink)55; border-radius:7px;
    font-family:inherit; font-size:14px; background:#fffdf8;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--blue);}
  .member-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .member-tag{
    background:var(--blue); color:var(--paper); padding:4px 10px; border-radius:100px; font-size:12px;
    display:flex;align-items:center;gap:6px;
  }
  .member-tag button{background:none;border:none;color:var(--paper);font-size:14px;line-height:1;padding:0;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  .cancel-btn{background:transparent;border:none;color:var(--ink)88;padding:10px 14px;font-size:14px;}

  /* Trip detail */
  .trip-head{margin-bottom:22px;}
  .trip-head h2{font-size:30px;margin:0 0 4px;}
  .trip-head .dates{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink)99;}
  .invite-box{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    background:var(--paper-2); border:1.5px dashed var(--ink)55; border-radius:9px;
    padding:10px 14px; margin-top:14px; font-size:13px;
  }

  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink); margin-bottom:22px; flex-wrap:wrap;}
  .tab{
    padding:10px 16px; font-size:13.5px; font-weight:600; background:none;border:none;
    border-radius:8px 8px 0 0; color:var(--ink)88;
  }
  .tab.active{background:var(--ink); color:var(--paper);}

  .expense-row{
    display:grid; grid-template-columns:34px 1fr auto; gap:12px; align-items:center;
    padding:12px 14px; background:var(--paper-2); border:1px solid var(--ink)33; border-radius:9px; margin-bottom:8px;
  }
  .expense-icon{font-size:20px; text-align:center;}
  .expense-desc{font-weight:600;font-size:14px;}
  .expense-meta{font-size:11.5px; color:var(--ink)88; font-family:'Space Mono',monospace; margin-top:2px;}
  .expense-amount{font-family:'Space Mono',monospace;font-weight:700; font-size:15px; text-align:right;}
  .del-x{background:none;border:none;color:var(--red);font-size:16px;margin-left:8px;opacity:.6;}
  .del-x:hover{opacity:1;}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px;}
  .kpi-card{
    background:var(--ink); color:var(--paper); border-radius:10px; padding:16px 18px;
  }
  .kpi-card .num{font-family:'Space Mono',monospace; font-size:24px; font-weight:700;}
  .kpi-card .lbl{font-size:11px; letter-spacing:1px; text-transform:uppercase; opacity:.7; margin-top:4px;}

  .bar-row{margin-bottom:12px;}
  .bar-row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .bar-track{height:10px;background:var(--paper-2); border:1px solid var(--ink)33; border-radius:6px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--blue);}

  .balance-toolbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .settled-note{font-size:12px; color:var(--ink)88; font-family:'Space Mono',monospace;}

  .balance-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin-bottom:24px;}
  .member-card{
    background:var(--paper-2); border:1.5px solid var(--ink)33; border-radius:12px; padding:16px;
    display:flex; flex-direction:column; gap:8px; min-height:132px;
  }
  .member-avatar{
    width:38px; height:38px; border-radius:50%; background:var(--ink); color:var(--paper);
    display:flex; align-items:center; justify-content:center; font-weight:700;
    font-family:'Space Mono',monospace; font-size:15px; flex-shrink:0;
  }
  .member-name{font-weight:700; font-size:14.5px;}
  .member-paid{font-size:11.5px; color:var(--ink)99; font-family:'Space Mono',monospace;}
  .member-chip{
    align-self:flex-start; padding:4px 11px; border-radius:100px; font-size:12px; font-weight:700;
    font-family:'Space Mono',monospace; margin-top:auto; display:flex; align-items:center; gap:5px;
  }
  .chip-owe{background:var(--ink); color:var(--paper);}
  .chip-owed{background:var(--gold); color:var(--paper);}
  .chip-even{background:transparent; color:var(--ink)88; border:1.5px dashed var(--ink)55;}

  .balance-pos{color:var(--ink); font-weight:700; font-family:'Space Mono',monospace;}
  .balance-neg{color:var(--ink); font-weight:700; font-family:'Space Mono',monospace;}
  .settle-row{
    display:flex; align-items:center; gap:10px; padding:12px 14px; background:#fffdf8;
    border:1px dashed var(--ink)55; border-radius:9px; margin-bottom:8px; font-size:14px;
  }
  .settle-row .arrow{color:var(--ink); font-weight:700;}
  .settle-btn{
    background:var(--ink); color:var(--paper); border:none; padding:10px 18px; border-radius:8px;
    font-weight:700; font-size:13px; display:inline-flex; align-items:center; gap:7px;
  }
  .settle-btn:hover{background:var(--blue-dark);}

  .add-expense-box{
    background:var(--paper-2); border:1.5px solid var(--ink); border-radius:12px; padding:18px; margin-bottom:24px;
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .ocr-zone{
    border:2px dashed var(--blue); border-radius:9px; padding:16px; text-align:center; margin-bottom:14px;
    background:#fffdf8; font-size:13px; color:var(--ink)aa;
  }
  .ocr-zone button{background:var(--gold); border:none; color:var(--ink); padding:8px 16px; border-radius:7px; font-weight:700; font-size:13px; margin-top:8px;}
  .ocr-status{font-family:'Space Mono',monospace; font-size:12px; margin-top:8px; color:var(--blue-dark);}
  .stamp-ok{
    display:inline-block; border:2px solid var(--green); color:var(--green); border-radius:6px;
    padding:3px 10px; font-size:11px; font-family:'Space Mono',monospace; transform:rotate(-4deg); margin-top:8px;
  }

  footer.app-footer{
    text-align:center; padding:26px 20px 40px; font-size:11px; color:var(--ink)77;
    font-family:'Space Mono',monospace; letter-spacing:.2px; max-width:900px; margin:0 auto;
  }
  footer.app-footer a{color:var(--blue-dark); text-decoration:none; border-bottom:1px dotted var(--blue-dark);}

  .loading-dots::after{content:'...'; animation:dots 1.2s steps(4,end) infinite;}
  @keyframes dots{0%,20%{content:'.';}40%{content:'..';}60%,100%{content:'...';}}

  @media(max-width:520px){
    .ticket{grid-template-columns:1fr 96px;}
    .row2{grid-template-columns:1fr;}
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>

<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script>
// --- Firebase / Firestore ---
const firebaseConfig = {
  apiKey: "AIzaSyDltdT6caFjhKfRPnItE9ERUF_KMugefsY",
  authDomain: "kuotrix-e6165.firebaseapp.com",
  projectId: "kuotrix-e6165",
  storageBucket: "kuotrix-e6165.firebasestorage.app",
  messagingSenderId: "460473030274",
  appId: "1:460473030274:web:1f2c27ed79967f743cc69b"
};

let db = null;
let fbReady = false;
let fbError = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  fbReady = true;
}catch(e){
  console.error('Error inicializando Firebase', e);
  fbError = e.message || 'Error desconocido';
}

const groupsCol = () => db.collection('groups');
const expensesCol = (tripId) => db.collection('groups').doc(tripId).collection('expenses');

const CATS = [
  {id:'alojamiento', label:'Alojamiento', icon:'🛏️'},
  {id:'restaurantes', label:'Restaurantes', icon:'🍽️'},
  {id:'transporte', label:'Transporte', icon:'🚕'},
  {id:'actividades', label:'Actividades', icon:'🎟️'},
  {id:'compras', label:'Compras', icon:'🛍️'},
  {id:'otros', label:'Otros', icon:'📎'},
];
const catInfo = id => CATS.find(c=>c.id===id) || CATS[CATS.length-1];
const fmt = n => (Math.round(n*100)/100).toFixed(2) + '€';
const genCode = () => Math.random().toString(36).slice(2,8).toUpperCase();

let state = {
  view:'home',          // home | trip
  projects:[],
  loading:true,
  currentTripId:null,
  expenses:[],
  tab:'gastos',
  showNewTrip:false,
  showJoinGroup:false,
};
let unsubGroups = null;
let unsubExpenses = null;

function startGroupsListener(){
  if(!fbReady) return;
  unsubGroups = groupsCol().orderBy('createdAt','desc').onSnapshot(
    snap => {
      state.projects = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      state.loading = false;
      render();
    },
    err => {
      console.error('Error escuchando grupos', err);
      state.loading = false;
      fbError = err.message;
      render();
    }
  );
}

function startExpensesListener(tripId){
  if(unsubExpenses) unsubExpenses();
  unsubExpenses = expensesCol(tripId).onSnapshot(
    snap => {
      state.expenses = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      render();
    },
    err => console.error('Error escuchando gastos', err)
  );
}

function openTrip(id){
  state.view='trip';
  state.currentTripId=id;
  state.tab='gastos';
  state.expenses=[];
  render();
  startExpensesListener(id);
}

function goHome(){
  if(unsubExpenses){ unsubExpenses(); unsubExpenses=null; }
  state.view='home';
  state.currentTripId=null;
  render();
}

function currentTrip(){
  return state.projects.find(p=>p.id===state.currentTripId);
}

function renderHome(){
  if(!state.projects.length){
    return `
      <div class="empty-state">
        <p class="display">Aún no hay grupos registrados</p>
        <p>Crea tu primer grupo para empezar a anotar los gastos compartidos.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
          <button class="primary-btn" onclick="openNewTrip()">＋ Crear grupo</button>
          <button class="ghost-btn" onclick="openJoinGroup()">🔗 Unirme con un código</button>
        </div>
      </div>`;
  }
  const cards = state.projects.map(p=>{
    const dates = p.start && p.end ? `${p.start} → ${p.end}` : 'Fechas sin definir';
    return `
      <div class="ticket" onclick="openTrip('${p.id}')">
        <button class="ticket-del" onclick="event.stopPropagation(); deleteTrip('${p.id}')" title="Eliminar grupo">✕</button>
        <div class="ticket-main">
          <p class="ticket-dest display">${escapeHtml(p.name)}</p>
          <p class="ticket-dates">${escapeHtml(p.destino||'')} · ${dates}</p>
          <div class="ticket-members">
            ${p.members.map(m=>`<span class="chip">${escapeHtml(m)}</span>`).join('')}
          </div>
        </div>
        <div class="ticket-stub">
          <span class="stub-total-label">Miembros</span>
          <span class="stub-total">${p.members.length}</span>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="section-title">
      <div>
        <p class="eyebrow">Mis grupos</p>
        <h2>${state.projects.length} grupo${state.projects.length>1?'s':''}</h2>
      </div>
      <div style="display:flex;gap:10px;">
        <button class="ghost-btn" onclick="openJoinGroup()">🔗 Unirme</button>
        <button class="primary-btn" onclick="openNewTrip()">＋ Nuevo grupo</button>
      </div>
    </div>
    ${cards}
  `;
}

function renderNewTripModal(){
  return `
  <div class="overlay" onclick="if(event.target===this) closeNewTrip()">
    <div class="modal">
      <h3>Nuevo grupo</h3>
      <div class="field"><label>Nombre del grupo</label><input id="ft-name" placeholder="Ej. Viaje a Lisboa, Piso Gran Vía, Cena de empresa..."></div>
      <div class="field"><label>Contexto (opcional)</label><input id="ft-dest" placeholder="Ej. Lisboa, Piso Gran Vía, Cena de empresa..."></div>
      <div class="row2">
        <div class="field"><label>Fecha inicio (opcional)</label><input id="ft-start" type="date"></div>

function renderKpiTab(trip){
  const total = state.expenses.reduce((s,e)=>s+Number(e.monto||0),0);
  const porDia = tripDays(trip) || 1;
  const byCat = {};
  CATS.forEach(c=>byCat[c.id]=0);
  state.expenses.forEach(e=>{ byCat[e.categoria]=(byCat[e.categoria]||0)+Number(e.monto||0); });
  const maxCat = Math.max(1,...Object.values(byCat));
  const bars = CATS.map(c=>`
    <div class="bar-row">
      <div class="top"><span>${c.icon} ${c.label}</span><span class="mono">${fmt(byCat[c.id]||0)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${((byCat[c.id]||0)/maxCat*100).toFixed(1)}%"></div></div>
    </div>`).join('');

  return `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="num">${fmt(total)}</div><div class="lbl">Gasto total</div></div>
      <div class="kpi-card"><div class="num">${fmt(total/porDia)}</div><div class="lbl">Por día</div></div>
      <div class="kpi-card"><div class="num">${fmt(trip.members.length? total/trip.members.length : 0)}</div><div class="lbl">Por persona</div></div>
      <div class="kpi-card"><div class="num">${state.expenses.length}</div><div class="lbl">Tickets registrados</div></div>
    </div>
    <p class="eyebrow">Gasto por categoría</p>
    ${bars}
  `;
}

function renderBalanceTab(trip){
  const n = trip.members.length;
  if(!n) return `<p>Añade miembros al grupo para calcular el balance.</p>`;

  const settledAt = trip.settledAt || 0;
  // Solo cuentan para el balance los gastos posteriores a la última liquidación
  const relevant = state.expenses.filter(e=>{
    const ts = e.createdAt || (e.fecha ? new Date(e.fecha+'T12:00:00').getTime() : 0);
    return ts > settledAt;
  });

  const total = relevant.reduce((s,e)=>s+Number(e.monto||0),0);
  const fairShare = total / n;
  const paid = {};
  trip.members.forEach(m=>paid[m]=0);
  relevant.forEach(e=>{ if(paid[e.miembro]!==undefined) paid[e.miembro]+=Number(e.monto||0); });

  const cards = trip.members.map(m=>{
    const diff = paid[m]-fairShare;
    const initials = m.trim().slice(0,2).toUpperCase();
    let chip;
    if(Math.abs(diff)<0.01) chip = `<span class="member-chip chip-even">✓ en paz</span>`;
    else if(diff>0) chip = `<span class="member-chip chip-owed">↑ le deben ${fmt(diff)}</span>`;
    else chip = `<span class="member-chip chip-owe">↓ debe ${fmt(-diff)}</span>`;
    return `
      <div class="member-card">
        <div class="member-avatar">${escapeHtml(initials)}</div>
        <div class="member-name">${escapeHtml(m)}</div>
        <div class="member-paid">Pagó ${fmt(paid[m])}</div>
        ${chip}
      </div>`;
  }).join('');

  // settle up — greedy
  const balances = trip.members.map(m=>({m, d:paid[m]-fairShare}));
  const debtors = balances.filter(b=>b.d<-0.005).map(b=>({...b})).sort((a,b)=>a.d-b.d);
  const creditors = balances.filter(b=>b.d>0.005).map(b=>({...b})).sort((a,b)=>b.d-a.d);
  const settlements = [];
  let i=0, j=0;
  while(i<debtors.length && j<creditors.length){
    const pay = Math.min(-debtors[i].d, creditors[j].d);
    if(pay>0.005) settlements.push({from:debtors[i].m, to:creditors[j].m, amount:pay});
    debtors[i].d += pay; creditors[j].d -= pay;
    if(Math.abs(debtors[i].d)<0.01) i++;
    if(Math.abs(creditors[j].d)<0.01) j++;
  }
  const settleHtml = settlements.length
    ? settlements.map(s=>`<div class="settle-row">${escapeHtml(s.from)} <span class="arrow">→</span> ${escapeHtml(s.to)} <span class="mono" style="margin-left:auto;font-weight:700;">${fmt(s.amount)}</span></div>`).join('')
    : `<p class="mono" style="color:var(--ink)88;">Todo el mundo está en paz. Nadie debe nada.</p>`;

  const settledNote = settledAt
    ? `Última liquidación: ${new Date(settledAt).toLocaleDateString('es-ES')} ${new Date(settledAt).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}`
    : 'Aún no se ha saldado ninguna cuenta en este grupo';

  return `
    <div class="balance-toolbar">
      <span class="settled-note">${settledNote}</span>
      <button class="settle-btn" onclick="settleTrip('${trip.id}')">🤝 Saldar cuentas</button>
    </div>
    <p class="eyebrow">Gasto medio por persona: <span class="mono">${fmt(fairShare)}</span></p>
    <div class="balance-grid">${cards}</div>
    <p class="eyebrow" style="margin-top:24px;">Para saldar cuentas</p>
    ${settleHtml}
  `;
}

window.settleTrip = async (tripId) => {
  const trip = state.projects.find(p=>p.id===tripId);
  if(!trip) return;
  const ok = confirm('Esto marcará que todas las deudas actuales del grupo quedan saldadas. Los gastos ya registrados se mantienen en el historial y en las KPIs, pero el balance empezará de cero a partir de ahora. ¿Continuar?');
  if(!ok) return;
  try{ await groupsCol().doc(tripId).update({ settledAt: Date.now() }); }
  catch(e){ console.error(e); alert('No se pudo guardar. Revisa tu conexión.'); }
};

function tripDays(trip){
  if(!trip.start || !trip.end) return null;
  const d1 = new Date(trip.start), d2 = new Date(trip.end);
  const diff = Math.round((d2-d1)/(1000*60*60*24))+1;
  return diff>0 ? diff : null;
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

window.deleteTrip = async (tripId) => {
  const trip = state.projects.find(p=>p.id===tripId);
  if(!trip) return;
  const ok = confirm(`¿Eliminar el grupo "${trip.name}"? Se borrarán también todos sus gastos. Esta acción no se puede deshacer.`);
  if(!ok) return;
  try{
    const snap = await expensesCol(tripId).get();
    const batch = db.batch();
    snap.docs.forEach(d=>batch.delete(d.ref));
    batch.delete(groupsCol().doc(tripId));
    await batch.commit();
  }catch(e){
    console.error(e);
    alert('No se pudo eliminar el grupo. Revisa tu conexión.');
    return;
  }
  if(state.currentTripId===tripId){ goHome(); }
};

async function handleOcrFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('ocr-status');
  statusEl.innerHTML = `Leyendo ticket<span class="loading-dots"></span>`;
  try{
    const { data: { text } } = await Tesseract.recognize(file, 'spa+eng');
    console.log('OCR texto crudo:', text); // útil para depurar si un ticket concreto falla
    const amount = extractTotal(text);
    const fecha = extractDate(text);
    const venue = extractVenue(text);

    const found = [];
    if(amount){ document.getElementById('ex-monto').value = amount.toFixed(2); found.push(`${amount.toFixed(2)}€`); }
    if(fecha){ document.getElementById('ex-fecha').value = fecha; found.push(fecha); }
    if(venue){
      const descInput = document.getElementById('ex-desc');
      if(!descInput.value.trim()) descInput.value = venue;
      found.push(venue);
    }

    if(found.length){
      statusEl.innerHTML = `<span class="stamp-ok">✓ DETECTADO: ${found.map(escapeHtml).join(' · ')}</span><br>Revisa los campos, el OCR no siempre acierta al 100%.`;
    } else {
      statusEl.textContent = 'No se detectó nada automáticamente — rellena los campos a mano.';
    }
  }catch(err){
    console.error(err);
    statusEl.textContent = 'No se pudo leer el ticket. Introduce los datos a mano.';
  }
}

/* --- Extracción de IMPORTE ---
   Prioriza líneas con "total a pagar" / "importe total", ignora "subtotal" / "base imponible",
   y si no encuentra nada fiable, usa el número más alto de todo el ticket como respaldo. */
function extractTotal(text){
  const lines = text.split('\n');
  const numRe = /(\d{1,4}[.,]\d{2})/g;
  const priorityRe = /total\s*a\s*pagar|importe\s*total|^total\b|total\s*€|total\s*eur/i;
  let best = null; // {val, weight}
  for(const line of lines){
    if(/subtotal|base\s*imponible/i.test(line)) continue;
    if(/total/i.test(line)){
      const matches = line.match(numRe);
      if(matches){
        const val = parseNum(matches[matches.length-1]);
        if(val){
          const weight = priorityRe.test(line) ? 2 : 1;
          if(!best || weight>best.weight || (weight===best.weight && val>best.val)){
            best = {val, weight};
          }
        }
      }
    }
  }
  if(best) return best.val;
  const all = text.match(numRe);
  if(all){
    const vals = all.map(parseNum).filter(v=>v && v<5000);
    if(vals.length) return Math.max(...vals);
  }
  return null;
}

/* --- Extracción de FECHA ---
   Busca patrones dd/mm/aaaa, dd-mm-aaaa, dd.mm.aaaa y aaaa-mm-dd, validando rangos razonables. */
function extractDate(text){
  const lines = text.split('\n');
  const now = new Date();
  const ymd = /(20\d{2})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/;
  const dmy = /(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/;
  for(const line of lines){
    let m = line.match(ymd);
    if(m){
      const y=+m[1], mo=+m[2], d=+m[3];
      if(mo>=1&&mo<=12&&d>=1&&d<=31) return isoDate(y,mo,d);
    }
    m = line.match(dmy);
    if(m){
      let d=+m[1], mo=+m[2], y=+m[3];
      if(y<100) y+=2000;
      if(mo>=1&&mo<=12&&d>=1&&d<=31&&y>=2015&&y<=now.getFullYear()+1) return isoDate(y,mo,d);
    }
  }
  return null;
}
function isoDate(y,mo,d){
  return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

/* --- Extracción de LUGAR/COMERCIO ---
   El nombre del negocio suele ir en las primeras líneas del ticket, en mayúsculas.
   Se descartan líneas de cabecera genéricas, teléfonos, CIF/NIF y líneas casi todo números. */
function extractVenue(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const skipRe = /^(ticket|factura|simplificada|recibo|gracias|cif|nif|tel[eé]fono|tfno|www\.|http|caja|atendido|fecha|hora)\b/i;
  for(let i=0; i<Math.min(lines.length, 8); i++){
    const line = lines[i];
    const letterCount = (line.match(/[a-zA-ZñÑáéíóúÁÉÍÓÚ]/g)||[]).length;
    const digitHeavy = (line.match(/\d/g)||[]).length >= 4;
    if(letterCount>=3 && !digitHeavy && !skipRe.test(line)){
      return line.length>60 ? line.slice(0,60) : line;
    }
  }
  return null;
}
function parseNum(s){
  return parseFloat(s.replace(',', '.'));
}
